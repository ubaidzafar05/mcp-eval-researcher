services:
  web-ui:
    profiles: ["core"]
    build:
      context: ./web-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_EXECUTION_MODE: ${NEXT_PUBLIC_EXECUTION_MODE:-inline}
        NEXT_PUBLIC_RUNTIME_PROFILE: ${NEXT_PUBLIC_RUNTIME_PROFILE:-minimal}
        NEXT_PUBLIC_QUALITY_PROFILE: ${NEXT_PUBLIC_QUALITY_PROFILE:-relaxed}
        NEXT_PUBLIC_DEFAULT_THEME: ${NEXT_PUBLIC_DEFAULT_THEME:-dark}
        NEXT_PUBLIC_UI_VERSION: ${NEXT_PUBLIC_UI_VERSION:-v6}
        NEXT_PUBLIC_SHOW_RAW_SOURCE_LEDGER_DEFAULT: ${NEXT_PUBLIC_SHOW_RAW_SOURCE_LEDGER_DEFAULT:-false}
    container_name: cloud-hive-web-ui
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy

  app:
    profiles: ["core"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-hive-app
    env_file:
      - .env.compose
    environment:
      RUNTIME_PROFILE: ${RUNTIME_PROFILE:-minimal}
      MCP_MODE: inprocess
      MCP_CALL_TIMEOUT_SECONDS: "30"
      STREAM_STAGE_IDLE_SECONDS_RESEARCH: "600"
      STREAM_STAGE_IDLE_SECONDS_SYNTHESIS: "1200"
      STREAM_MAX_RUNTIME_SECONDS: "2400"
      AUTO_RETRY_FOR_QUALITY: "true"
      CORRECTION_LOOP_LIMIT: "1"
      CONTRADICTION_SCAN_REQUIRED: "false"
      ROUTER_MODE: "heuristic"
      ROUTER_MAX_CONTEXT_DEEP: "20000"
      OLLAMA_MODEL_FAST: "${OLLAMA_MODEL_FAST:-qwen2.5-coder:1.5b}"
      OLLAMA_MODEL_PRIMARY: "${OLLAMA_MODEL_PRIMARY:-qwen3:8b}"
      OLLAMA_MODEL_DEEP: "${OLLAMA_MODEL_DEEP:-deepseek-r1:14b}"
      LLM_REQUEST_TIMEOUT_SECONDS_RESEARCH: "90"
      LLM_REQUEST_TIMEOUT_SECONDS_SYNTHESIS: "600"
      RELAXED_QUALITY_MODE: "true"
      WEB_CONCURRENCY: "2"
      OLLAMA_ENDPOINT: http://host.docker.internal:11434
      OLLAMA_MODEL_EMBED: nomic-embed-text
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9010"
      API_RATE_LIMIT_RPM: "30"
    ports:
      - "8080:8080"
      - "9010:9010"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
    stop_grace_period: 30s
    depends_on:
      web-mcp-http:
        condition: service_healthy
      local-mcp-http:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)",
        ]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web-mcp-http:
    profiles: ["core"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-hive-web-mcp
    env_file:
      - .env.compose
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT_WEB: "8001"
      MCP_ALLOW_INSECURE_HTTP: "false"
      MCP_ALLOW_EXTERNAL_BIND: "true"
    command: ["python", "-m", "mcp_server.web_streamable_http_app"]
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8001)); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  local-mcp-http:
    profiles: ["core"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-hive-local-mcp
    env_file:
      - .env.compose
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT_LOCAL: "8002"
      MCP_ALLOW_INSECURE_HTTP: "false"
      MCP_ALLOW_EXTERNAL_BIND: "true"
    command: ["python", "-m", "mcp_server.local_streamable_http_app"]
    ports:
      - "8002:8002"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8002)); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  redis:
    profiles: ["distributed"]
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    profiles: ["distributed"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-hive-worker
    env_file:
      - .env.compose
    environment:
      RUNTIME_PROFILE: balanced
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Ensure workers can reach MCP servers
      MCP_HTTP_WEB_URL: http://web-mcp-http:8001/mcp
      MCP_HTTP_LOCAL_URL: http://local-mcp-http:8002/mcp
      MCP_CALL_TIMEOUT_SECONDS: "120"
      STREAM_STAGE_IDLE_SECONDS_RESEARCH: "1200"
      STREAM_STAGE_IDLE_SECONDS_SYNTHESIS: "1800"
      AUTO_RETRY_FOR_QUALITY: "true"
      CORRECTION_LOOP_LIMIT: "1"
      CONTRADICTION_SCAN_REQUIRED: "false"
      ROUTER_MODE: "heuristic"
      ROUTER_MAX_CONTEXT_DEEP: "20000"
      OLLAMA_MODEL_FAST: "${OLLAMA_MODEL_FAST:-qwen2.5-coder:1.5b}"
      OLLAMA_MODEL_PRIMARY: "${OLLAMA_MODEL_PRIMARY:-qwen3:8b}"
      OLLAMA_MODEL_DEEP: "${OLLAMA_MODEL_DEEP:-deepseek-r1:14b}"
      LLM_REQUEST_TIMEOUT_SECONDS_RESEARCH: "300"
      LLM_REQUEST_TIMEOUT_SECONDS_SYNTHESIS: "600"
      RELAXED_QUALITY_MODE: "true"
      OLLAMA_ENDPOINT: http://host.docker.internal:11434
      OLLAMA_MODEL_EMBED: nomic-embed-text
    command:
      [
        "celery",
        "-A",
        "graph.distributed",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
      ]
    depends_on:
      redis:
        condition: service_healthy
      web-mcp-http:
        condition: service_healthy
      local-mcp-http:
        condition: service_healthy

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: cloud-hive-prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    container_name: cloud-hive-grafana
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:latest
    container_name: cloud-hive-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
